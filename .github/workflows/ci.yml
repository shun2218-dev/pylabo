name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 型チェック・テスト・ビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存関係のインストール
        # postinstall で Pyodide 本体と wheel が public/pyodide へ用意される
        run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: ユニットテスト
        run: npm test

      - name: ビルド
        run: npm run build

  exercises:
    name: 演習の解答例が採点を通るか
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 演習の検証に使う Python パッケージ
        run: python -m pip install --quiet pandas matplotlib

      - run: npm ci

      - name: 全演習の解答例を実行して採点を確認
        run: npm run verify:exercises
